name: Label pull requests
# Adds the area labels of .github/labeler.yml. It reads only the list of
# changed paths — it never checks out or runs a pull request's code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5
        with:
          sync-labels: false
